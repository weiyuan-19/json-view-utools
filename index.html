<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>JSON 编辑器</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-workspace" aria-label="JSON 编辑区">
        <div id="editor"></div>
        <button id="problem-summary" class="problem-summary" type="button" title="查看 JSON 问题列表" hidden></button>
        <div id="problem-overview" class="problem-overview" aria-label="JSON 行概览"></div>
        <section id="problem-panel" class="problem-panel" aria-label="JSON 问题列表" hidden>
          <header class="problem-panel-header">
            <span id="problem-position"></span>
            <div class="problem-panel-controls">
              <button id="previous-problem" type="button" title="上一个问题" aria-label="上一个问题">↑</button>
              <button id="next-problem" type="button" title="下一个问题" aria-label="下一个问题">↓</button>
              <button id="close-problems" type="button" title="关闭问题列表" aria-label="关闭问题列表">×</button>
            </div>
          </header>
          <ol id="problem-list"></ol>
        </section>
        <section id="decoded-panel" class="decoded-panel" aria-label="去转义结果" hidden>
          <header class="decoded-panel-header">
            <strong id="decoded-title">去转义结果</strong>
            <div class="decoded-panel-controls">
              <button id="replace-all-decoded" type="button" hidden>全部替换</button>
              <button id="replace-all-lua-json" type="button" hidden>全部Lua转Json并替换</button>
              <button id="close-decoded" type="button" aria-label="关闭去转义结果">×</button>
            </div>
          </header>
          <div id="decoded-items"></div>
        </section>
        <p id="status" class="status-toast" role="status" aria-live="polite"></p>
      </section>

      <footer class="toolbar">
        <div class="toolbar-actions" role="group" aria-label="JSON 操作">
          <button id="copy" class="tool-button" type="button" title="复制全部编辑内容"><span aria-hidden="true">⧉</span><span>复制全部</span></button>
          <button id="format" class="tool-button" type="button" title="格式化 JSON / JSONC（4 个空格，保留注释）"><span aria-hidden="true">{ }</span><span>格式化</span></button>
          <button id="fold-all" class="tool-button" type="button" title="折叠全部"><span aria-hidden="true">⌄</span><span>折叠全部</span></button>
          <button id="unfold-all" class="tool-button" type="button" title="展开全部"><span aria-hidden="true">⌃</span><span>展开全部</span></button>
          <button id="strip-comments" class="tool-button" type="button" title="去掉 // 和 /* */ 注释"><span aria-hidden="true">≠</span><span>去除注释</span></button>
          <button id="minify" class="tool-button" type="button" title="压缩 JSON / JSONC（保留注释及行注释后的必要换行）"><span aria-hidden="true">⇥</span><span>压缩</span></button>
          <button id="escape" class="tool-button" type="button" title="压缩并转义 JSON / JSONC（保留注释）"><span aria-hidden="true">\"</span><span>压缩并转义</span></button>
          <button id="unescape" class="tool-button" type="button" title="去除转义字符"><span aria-hidden="true">↙</span><span>去除转义</span></button>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
